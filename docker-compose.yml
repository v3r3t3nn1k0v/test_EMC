# Виртуальные очереди: Kafka + сервис + генератор.
#
#   docker compose up --build              # подняться целиком
#   docker compose run --rm watch-queue    # смотреть queue.v1
#   docker compose run --rm watch-decisions# смотреть decision.v1
#   docker compose run --rm watch-telemetry
#
# Снаружи (с хоста) брокер доступен на localhost:29092.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: vq-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

  init-topics:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-eu", "-c"]
    command: |
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.v1 --partitions 4
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic queue.v1 --partitions 4
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic decision.v1 --partitions 4"

  service:
    build: .
    command: python -m vq.service
    depends_on:
      kafka:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped

  generator:
    build: .
    command: python -m vq.generator
    depends_on:
      kafka:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GEN_SPEEDUP: "10"        # 1 — реальный темп
      GEN_LATE_MAX_S: "60"     # максимум опоздания сообщений, с
      GEN_DUPLICATE_PROB: "0.005"
    restart: unless-stopped

  # --- утилиты наблюдения (запускаются по требованию) ---
  watch-queue:
    image: apache/kafka:3.9.0
    profiles: ["tools"]
    entrypoint: ["/opt/kafka/bin/kafka-console-consumer.sh"]
    command: --bootstrap-server kafka:9092 --topic queue.v1 --from-beginning
    depends_on:
      kafka:
        condition: service_healthy

  watch-decisions:
    image: apache/kafka:3.9.0
    profiles: ["tools"]
    entrypoint: ["/opt/kafka/bin/kafka-console-consumer.sh"]
    command: --bootstrap-server kafka:9092 --topic decision.v1 --from-beginning
    depends_on:
      kafka:
        condition: service_healthy

  watch-telemetry:
    image: apache/kafka:3.9.0
    profiles: ["tools"]
    entrypoint: ["/opt/kafka/bin/kafka-console-consumer.sh"]
    command: --bootstrap-server kafka:9092 --topic telemetry.v1 --timeout-ms 5000
    depends_on:
      kafka:
        condition: service_healthy
