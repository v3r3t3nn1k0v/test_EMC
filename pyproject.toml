[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vq"
version = "0.1.0"
description = "Виртуальные очереди: восстановление очередей на станциях и рекомендация станций по телеметрии"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
